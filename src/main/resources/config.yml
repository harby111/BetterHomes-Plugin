# BetterHomes configuration. All text supports MiniMessage: https://docs.advntr.dev/minimessage/format.html

homes:
  # Limit when no betterhomes.limit.<n> permission is held (highest permission wins).
  default-limit: 2

teleport:
  delay: 5            # seconds
  bar-length: 20      # characters in the animated progress bar

database:
  file: homes.db
  pool-size: 4        # requires restart

date-format: "yyyy-MM-dd HH:mm"

prefix: "<dark_gray>[<gradient:#55ffff:#5555ff>BetterHomes</gradient>]</dark_gray> "

messages:
  players-only: "<red>This command can only be used by players."
  no-permission: "<red>You don't have permission to do that."
  data-not-loaded: "<red>Your home data is still loading, please try again in a moment."
  database-error: "<red>A database error occurred. Please contact an administrator."
  home-set: "<green>Home <yellow><name></yellow> created at your location <gray>(<used>/<limit>)</gray>."
  home-limit: "<red>You have reached your home limit of <yellow><limit></yellow>."
  home-deleted: "<green>Home <yellow><name></yellow> deleted."
  home-not-found: "<red>Home <yellow><name></yellow> does not exist."
  world-missing: "<red>The world of that home is not loaded."
  player-not-found: "<red>Player <yellow><player></yellow> was not found."
  usage-delhome: "<gray>Usage: <yellow>/delhome <name>"
  usage-betterhomes: "<gray>Usage: <yellow>/betterhomes reload"
  reload-success: "<green>Configuration reloaded."
  teleport-start: "<gray>Teleporting to home <yellow><name></yellow> in <yellow><seconds>s</yellow>. <red>Don't move!"
  teleport-cancelled-move: "<red>Teleport cancelled because you moved!"
  teleport-cancelled-damage: "<red>Teleport cancelled because you took damage!"
  teleport-success: "<green>Teleported to home <yellow><name></yellow>."

actionbar:
  # Placeholders: <home> <bar> <time>
  teleporting: "<gray>Teleporting to <yellow><home></yellow> <dark_gray>[</dark_gray><bar><dark_gray>]</dark_gray> <white><time>s"
  arrived: "<green>✔ Welcome home!"

gui:
  title: "<dark_gray>Your Homes"
  admin-title: "<dark_red>Homes of <player>"
  # Placeholders: <name> <world> <x> <y> <z> <date>
  home-name: "<gradient:#ffb199:#ff0844><bold>Home <name>"
  home-lore:
    - "<gray>World: <white><world>"
    - "<gray>Coordinates: <white><x>, <y>, <z>"
    - "<gray>Created: <white><date>"
    - ""
    - "<green>Left-Click <dark_gray>» <gray>Teleport"
    - "<red>Right-Click <dark_gray>» <gray>Delete"
  create-name: "<green><bold>Create new home"
  create-lore:
    - "<gray>Sets a home at your location."
    - "<gray>Homes: <white><used>/<limit>"
  limit-name: "<red><bold>Home limit reached"
  limit-lore:
    - "<gray>Homes: <white><used>/<limit>"
    - "<gray>Delete a home to make space."
  prev-name: "<yellow>« Previous Page"
  next-name: "<yellow>Next Page »"
  page-name: "<gray>Page <white><page><gray>/<white><pages>"
  admin-info-name: "<red><bold>Admin view"
  admin-info-lore:
    - "<gray>Inspecting homes of <white><player>"
    - "<gray>Homes: <white><used>"

# Native Bedrock forms (requires Geyser + Floodgate). Bedrock players get a form menu
# instead of the chest GUI. MiniMessage is converted to Bedrock-compatible colours.
bedrock:
  use-forms: true
  title: "<dark_gray>Your Homes"
  admin-title: "<dark_red>Homes of <player>"
  menu-content: "<gray>Homes: <white><used>/<limit>\n<gray>Select a home:"
  admin-menu-content: "<gray>Inspecting <white><player><gray> (<white><used><gray> homes)\n<gray>Select a home:"
  # Placeholders: <name> <world> <x> <y> <z> <date>
  home-button: "<dark_gray><bold>Home <name></bold>\n<gray><world> | <x>, <y>, <z>"
  create-button: "<dark_green><bold>+ Create new home"
  home-title: "<dark_gray>Home <name>"
  home-info: "<gray>World: <white><world>\n<gray>Coordinates: <white><x>, <y>, <z>\n<gray>Created: <white><date>"
  teleport-button: "<dark_green>Teleport"
  delete-button: "<dark_red>Delete"
  back-button: "<dark_gray>Back"
  confirm-title: "<dark_red>Delete home"
  confirm-content: "<gray>Are you sure you want to delete home <white><name><gray>?"
  confirm-yes: "<dark_red>Yes, delete"
  confirm-no: "<dark_gray>Cancel"
